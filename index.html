   <div class="card stat"><div class="l">Tugas berjalan<span class="ico">${ico('task')}</span></div><div class="v">${aktif.length} <small>tugas aktif</small></div><div class="sm mut">${aktif.length?aktif.length+' perlu dikerjakan':'Belum ada tugas'}</div></div>
   <div class="card stat"><div class="l">Rata-rata nilai<span class="ico">${ico('star')}</span></div><div class="v num">3.83 <small>/ 4.00 IPS est.</small></div><div class="sm mut">Sangat memuaskan</div></div>
   <div class="card stat"><div class="l">Kehadiran<span class="ico">${ico('user')}</span></div><div class="v num">96.2%</div><div class="sm" style="color:var(--ok)">Di atas batas 75%</div></div>

   <div class="list">${jd.length?'':'<div class="empty">Tidak ada kuliah hari ini.</div>'}${jd.map(m=>{const s=st(m),[a,b]=m.jam.split('-');return`<div class="item ${s==='now'?'now':''}"><div class="time">${a}<small>${b}</small></div><div style="flex:1;min-width:0"><div style="font-weight:700">${m.nama} ${s==='sel'?chip('Selesai','ok'):s==='now'?chip('Berlangsung','warn'):chip('Nanti','gray')}</div><div class="sm mut">${m.ruang} · Kelas ${m.kelas} · ${m.sks} SKS</div></div>
   ${s==='now'?`<button class="btn p sm" data-act="presensi" data-id="${m.id}">Presensi</button>`:s==='sel'?`<span class="sm" style="color:var(--ok)">Hadir</span>`:`<button class="btn sm" data-go="mk-${m.id}">Materi</button>`}</div>`}).join('')}</div>
   <p class="sm mut" style="margin-top:12px">${besokTxt}</p></section>
   <section class="card"><div class="row between" style="margin-bottom:14px"><h2 class="h2">Progres pertemuan semester</h2><span class="sm mut">Minggu ke-6 dari 16</span></div>

PAGES.matkul=()=>{
  const f=S.filter.mk||'';
  const list=MK.filter(m=>!f||(m.nama+m.dosen+m.ruang+m.kode).toLowerCase().includes(f.toLowerCase()));
  const html=`<section class="card"><div class="row between" style="gap:16px"><div><div class="row" style="margin-bottom:6px">${chip('Semester '+ME.ta)}${chip(ME.prodi,'gray')}</div><h1 class="h1">Mata Kuliah Saya</h1><p class="mut">Pantau progres 16 pertemuan dan buka materi tiap mata kuliah.</p></div>
  <div class="row" style="gap:20px"><div class="stat"><span class="l">Total SKS</span><span class="v">${SKS} <small>/ 24</small></span></div><div class="stat"><span class="l">Presensi</span><span class="v" style="color:var(--ok)">96%</span></div></div></div></section>
  <label class="search" style="width:100%;max-width:none;border-radius:12px">${ico('search','sm')}<input id="fmk" type="search" placeholder="Cari mata kuliah, ruang, atau dosen…" value="${esc(f)}"></label>
  <section class="grid g3">${list.map(m=>`<article class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between">${chip(m.kelas)} ${chip('Aktif','ok')}</div><div><h3 class="h2">${m.nama}</h3><div class="sm mut">${m.dosen}</div></div>
  <div class="item sm" style="justify-content:space-between;padding:8px 12px">${ico('clock','sm')}<span style="flex:1">${HARI[m.hari]}, ${m.jam.replace('-',' – ')}</span><b>${m.ruang}</b></div>
  <div><div class="row between sm" style="margin-bottom:4px"><span>Pertemuan ${m.done} dari 16</span><b>${pct(m.done,16)}%</b></div>${bar(pct(m.done,16))}</div>
  <button class="btn p w" data-go="mk-${m.id}">Buka detail ${ico('arrow','sm')}</button></article>`).join('')||'<div class="card empty">Tidak ada mata kuliah yang cocok.</div>'}</section>`;
  return{html,crumb:cr('Beranda','Mata Kuliah Saya'),after(){const i=$('#fmk');i.oninput=()=>{S.filter.mk=i.value;S._noscroll=1;const p=i.selectionStart;render();const n=$('#fmk');n.focus();n.setSelectionRange(p,p)}}};
};
PAGES.mk=(id)=>{
  const m=mk(id)||MK[0];const tab=S.tab['mk'+m.id]||'pertemuan';
  const tg=TUGAS.filter(t=>t.mk===m.id);
  let body='';
  if(tab==='pertemuan'){body=`<div class="list">${PERT.map((p,i)=>{const n=i+1,d=n<=m.done;return`<div class="item"><div class="time" style="min-width:44px">${String(n).padStart(2,'0')}</div><div style="flex:1;min-width:0"><b>${p}</b><div class="sm mut">${PTGL[i]} 2026</div></div>${d?chip('Hadir','ok'):n===m.done+1?chip('Berikutnya','warn'):chip('Terjadwal','gray')}</div>`}).join('')}</div>`}
  else if(tab==='materi'){body='<div class="empty">Belum ada materi untuk mata kuliah ini.</div>'}
  else if(tab==='tugas'){body=tg.length?`<div class="list">${tg.map(t=>`<button class="item" style="border:0;text-align:left" data-go="tg-${t.id}"><div style="flex:1"><b>${t.judul}</b><div class="sm mut">Tenggat ${tgl(t.dl)}</div></div>${chip(ST[t.st][0],ST[t.st][1])}</button>`).join('')}</div>`:'<div class="empty">Belum ada tugas.</div>'}
  else{body=`<div class="grid g3">${Object.entries(m.komp).map(([k,v])=>`<div class="card flat stat"><span class="l">${k}</span><span class="v num">${v}</span></div>`).join('')}</div><p class="sm mut" style="margin-top:12px">Nilai komponen sementara. Nilai akhir resmi muncul setelah dosen mempublikasikan.</p>`}
  const html=`<section class="hero"><div class="row" style="margin-bottom:10px">${chip('Aktif','ok')}${chip(m.kelas)}${chip(m.sks+' SKS')}</div><h1 class="h1">${m.nama}</h1><div class="mut row" style="margin-top:8px;gap:16px"><span>${m.kode}</span><span>${HARI[m.hari]}, ${m.jam}</span><span>${m.ruang}</span></div>
  <div class="row between" style="margin-top:18px;gap:20px"><div><div class="mut sm">Dosen pengampu</div><b>${m.dosen}</b></div><div style="min-width:200px;flex:1;max-width:320px"><div class="row between sm" style="margin-bottom:4px"><span>Progres pembelajaran</span><b>${(m.done/16*100).toFixed(1)}%</b></div><div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${pct(m.done,16)}%;background:#fff"></i></div></div></div></section>
  <div class="grid g4"><div class="card stat"><span class="l">Presensi</span><span class="v num">${pct(m.hdr,m.done)}%</span><span class="sm mut">${m.hdr} dari ${m.done} hadir</span></div><div class="card stat"><span class="l">Rerata nilai</span><span class="v num">${m.nilai??'—'}</span><span class="sm mut">${m.nilai?'Sementara · '+grade(m.nilai)[0]:'Belum ada nilai'}</span></div><div class="card stat"><span class="l">Tugas aktif</span><span class="v">${tg.filter(t=>!['dinilai','ditinjau'].includes(t.st)).length}</span></div><div class="card stat"><span class="l">Sisa pertemuan</span><span class="v">${16-m.done}</span></div></div>
  <div class="tabs" role="tablist">${[['pertemuan','Pertemuan (16)'],['materi','Materi'],['tugas','Tugas'],['nilai','Nilai']].map(t=>`<button class="tab ${tab===t[0]?'on':''}" role="tab" data-tab="mk${m.id}:${t[0]}">${t[1]}</button>`).join('')}</div>
  <section class="card">${body}</section>`;
  return{html,crumb:cr('Beranda','<a href="#matkul">Mata Kuliah Saya</a>',m.nama)};
};
/* ===== Kalender ===== */
PAGES.kalender=()=>{
  const view=S.tab.cal||'minggu';
  
  const mo0=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-((TODAY.getDay()+6)%7)),days=[0,1,2,3,4].map(i=>new Date(mo0.getFullYear(),mo0.getMonth(),mo0.getDate()+i)),Y=TODAY.getFullYear(),MO=TODAY.getMonth(),wk=Math.min(16,Math.max(1,Math.floor((TODAY-new Date(2026,7,10))/6048e5)+1));
  const evOf=d=>[...MK.filter(m=>m.hari===d.getDay()).map(m=>({t:m.nama,j:m.jam.replace('-',' – '),s:m.ruang+' · '+m.dosen.split(',')[0],k:'kl',past:d.toDateString()===TODAY.toDateString()&&m.jam.slice(6)<TODAY.toTimeString().slice(0,5)})),...EVENTS.filter(e=>e.d.toDateString()===d.toDateString()).map(e=>({t:e.t,j:e.j,s:e.k==='dl'?'Deadline tugas':'Praktikum',k:e.k}))].sort((a,b)=>a.j.localeCompare(b.j));
  let main='';
  if(view==='minggu'){main=`<div class="wk">${days.map(d=>{const ev=evOf(d);const t=d.toDateString()===TODAY.toDateString();return`<div class="col"><div class="row between"><b>${HARI[d.getDay()]}</b><span class="sm mut">${d.getDate()} ${BLN[d.getMonth()].slice(0,3)}${t?' · Hari ini':''}</span></div>${ev.map(e=>`<div class="ev-c ${e.k==='dl'?'dl':e.k==='pr'?'pr':e.past?'done':''}"><span class="sm mut num">${e.j}</span><b>${e.t}</b><span class="sm mut">${e.s}</span></div>`).join('')||'<div class="sm mut">Tidak ada agenda</div>'}</div>`}).join('')}</div>`}
  else{const all=[];for(let i=0;i<14;i++){const d=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+i);evOf(d).forEach(e=>all.push([d,e]))}
    main=`<div class="list">${all.map(([d,e])=>`<div class="item"><div class="time">${d.getDate()}<small>${BLN[d.getMonth()].slice(0,3)}</small></div><div style="flex:1;min-width:0"><b>${e.t}</b><div class="sm mut">${HARI[d.getDay()]} · ${e.j} · ${e.s}</div></div>${e.k==='dl'?chip('Deadline','bad'):e.k==='pr'?chip('Praktikum','warn'):chip('Kuliah')}</div>`).join('')}</div>`}
  const first=new Date(Y,MO,1).getDay(),dim=new Date(Y,MO+1,0).getDate();
  const evd=new Set(EVENTS.map(e=>e.d.getDate()));
  const mini=`<div class="cal">${['M','S','S','R','K','J','S'].map(x=>`<span>${x}</span>`).join('')}${Array(first).fill('<i></i>').join('')}${Array.from({length:dim},(_,i)=>i+1).map(n=>`<button class="${n===TODAY.getDate()?'today':evd.has(n)?'ev':''}" data-act="pickday" data-n="${n}">${n}</button>`).join('')}</div>`;
  const html=`<section class="card"><div class="row between" style="gap:16px"><div><div class="row" style="margin-bottom:6px">${chip('Semester '+ME.ta)}</div><h1 class="h1">Kalender & Jadwal Kuliah</h1><p class="mut">Jadwal mingguan, tenggat tugas, dan agenda praktikum. Zona waktu WIB (UTC+7).</p></div><div class="chip ok">Google Calendar: simulasi</div></div></section>
  <div class="row between"><div class="tabs">${[['minggu','Minggu ini'],['agenda','Agenda']].map(t=>`<button class="tab ${view===t[0]?'on':''}" data-tab="cal:${t[0]}">${t[1]}</button>`).join('')}</div><span class="chip">${BLN[MO]} ${Y} · Minggu ke-${wk}</span></div>
  <div class="split"><section class="card">${main}</section><div style="display:flex;flex-direction:column;gap:20px"><section class="card"><h2 class="h2" style="margin-bottom:10px">${BLN[MO]} ${Y}</h2>${mini}</section>
  <section class="card"><h2 class="h2" style="margin-bottom:10px">Tenggat pekan ini</h2><div class="list">${TUGAS.length?'':'<div class="empty">Belum ada tugas.</div>'}${TUGAS.filter(t=>t.dl>TODAY&&t.dl<new Date(TODAY.getTime()+7*864e5)).sort((a,b)=>a.dl-b.dl).map(t=>`<button class="item" style="border:0;text-align:left" data-go="tg-${t.id}"><div style="flex:1"><b>${t.judul.split(':')[0]}</b><div class="sm mut">${mk(t.mk).nama}</div></div><span class="sm" style="color:var(--bad);font-weight:600">${sisa(t.dl)}</span></button>`).join('')}</div></section></div></div>`;
  return{html,crumb:cr('Beranda','Kalender')};
};

/* ===== Tugas ===== */
PAGES.tugas=()=>{

  const rows=TUGAS.filter(fs[f]).sort((a,b)=>a.dl-b.dl);
  const html=`<section class="card"><div class="row between" style="gap:16px"><div><h1 class="h1">Tugas</h1><p class="mut">Status di sini adalah status pengumpulan resmi. Status Kanban pribadi ada di Study Planner.</p></div><button class="btn p" data-act="addtg">${ico('plus','sm')} Tambah tugas</button></div></section>
  <div class="tabs">${[['semua','Semua ('+TUGAS.length+')'],['aktif','Perlu dikerjakan'],['selesai','Sudah dikumpulkan']].map(t=>`<button class="tab ${f===t[0]?'on':''}" data-tab="tg:${t[0]}">${t[1]}</button>`).join('')}</div>
  <section class="card"><div class="tbl"><table><thead><tr><th>Tugas</th><th>Mata kuliah</th><th>Tenggat</th><th>Status</th><th>Nilai</th><th>Aksi</th></tr></thead><tbody>${rows.length?'':'<tr><td colspan="6"><div class="empty">Belum ada tugas.</div></td></tr>'}${rows.map(t=>`<tr><td><button class="btn sm" style="border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--fg)" data-go="tg-${t.id}">${t.judul}</button><div class="sm mut">Prioritas ${t.pri} · bobot ${t.bobot}%</div></td><td>${(mk(t.mk)||{nama:'—'}).nama}</td><td class="num">${tgl(t.dl)}<div class="sm mut">${t.dl>TODAY&&!['dinilai','ditinjau'].includes(t.st)?'sisa '+sisa(t.dl):''}</div></td><td>${chip(ST[t.st][0],ST[t.st][1])}</td><td class="num">${t.nilai??'—'}</td><td><button class="btn sm" data-act="edtg" data-id="${t.id}" aria-label="Edit ${esc(t.judul)}">${ico('edit','sm')} Edit</button></td></tr>`).join('')}</tbody></table></div></section>`;

  <section class="card"><div class="row between" style="margin-bottom:6px"><h2 class="h2">Simulasi target nilai UAS</h2>${chip('Estimasi, bukan nilai resmi','warn')}</div><p class="sm mut" style="margin-bottom:14px">Hitung nilai UAS minimal agar nilai akhir mencapai target.</p>
  <div class="grid g2"><div class="list" style="gap:14px"><label class="f">Mata kuliah<select id="cm">${MKN.map(m=>`<option value="${m.id}" ${m.id==calc.mk?'selected':''}>${m.nama} (skor kini ${m.nilai})</option>`).join('')}</select></label>
  <label class="f">Target nilai akhir <span class="mut" id="ctv">${calc.target}</span><input id="ct" type="range" min="60" max="100" value="${calc.target}"></label>
  <label class="f">Bobot UAS <span class="mut" id="cbv">${calc.bobot}%</span><input id="cb" type="range" min="10" max="60" step="5" value="${calc.bobot}"></label></div>
  <div class="card flat" id="cres" style="background:var(--bg)"></div></div></section>`;
  return{html,crumb:cr('Beranda','Nilai'),after(){
    const upd=()=>{const n=hitung(),ok=n<=100;$('#ctv').textContent=calc.target;$('#cbv').textContent=calc.bobot+'%';
      $('#cres').innerHTML=`<div class="sm mut" style="font-weight:600">KEBUTUHAN NILAI UAS</div><div class="h1 num" style="font-size:44px;color:${ok?'var(--rose)':'var(--bad)'}">${n<0?0:n.toFixed(1)}<small style="font-size:16px;color:var(--mute)"> / 100</small></div><p class="sm" style="margin-top:8px">${ok?`Kamu perlu minimal <b>${Math.max(n,0).toFixed(1)}</b> pada UAS (bobot ${calc.bobot}%) untuk mencapai nilai akhir ${calc.target}.`:'Target ini tidak bisa dicapai dengan bobot UAS tersebut, karena nilai UAS yang dibutuhkan lebih dari 100.'}</p><p class="sm mut" style="margin-top:8px">Perkiraan, bukan nilai resmi.</p>`};
    $('#cm').onchange=e=>{calc.mk=+e.target.value;upd()};$('#ct').oninput=e=>{calc.target=+e.target.value;upd()};$('#cb').oninput=e=>{calc.bobot=+e.target.value;upd()};upd()}};
};

/* ===== Riwayat Akademik ===== */
PAGES.riwayat=()=>{
  const sel=S.tab.sem||5;const s=SEM.find(x=>x.n==sel);
  const pts=SEM.filter(x=>x.ips);const W=520,H=170,px=i=>40+i*(W-80)/(pts.length-1),py=v=>H-30-(v-3.6)/(4-3.6)*(H-60);
  const line=pts.map((p,i)=>`${i?'L':'M'}${px(i)},${py(p.ips)}`).join(' ');
  const html=`<section class="card"><div class="row between" style="gap:16px"><div><div class="row" style="margin-bottom:6px">${chip('Transkrip & capaian SKS')}</div><h1 class="h1">Riwayat Akademik Semester 1–8</h1><p class="mut">${ME.prodi} · Dosen PA ${ME.pa}</p></div></div></section>
  <section class="grid g3"><div class="card stat"><span class="l">IPK kumulatif</span><span class="v num">3.82 <small>/ 4.00</small></span><span class="sm" style="color:var(--ok)">Predikat pujian (Cum Laude) jika ≥ 3.50</span></div><div class="card stat"><span class="l">SKS lulus</span><span class="v num">88 <small>/ 144</small></span>${bar(61)}</div><div class="card stat"><span class="l">Semester berjalan</span><span class="v">Semester 5</span><span class="sm mut">${SKS} SKS · pertemuan ke-6 dari 16</span></div></section>
  <section class="card"><h2 class="h2" style="margin-bottom:12px">Timeline studi</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px">${SEM.map(x=>`<button class="item" style="flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid ${x.n==sel?'var(--rose)':'var(--line)'};background:${x.n==sel?'var(--tint)':'var(--bg)'}" data-tab="sem:${x.n}"><b>Sem ${x.n}</b><span class="sm mut">${x.ta}</span><span class="sm"><b class="num">${x.ips?'IPS '+x.ips.toFixed(2):x.plan}</b></span><span class="sm mut">${x.sks} SKS</span>${x.aktif?chip('Aktif','warn'):x.ips?chip('Lulus','ok'):chip('Rencana','gray')}</button>`).join('')}</div></section>
  <section class="card"><h2 class="h2" style="margin-bottom:12px">Semester ${s.n} · ${s.ta}</h2>${s.n===5?`<div class="tbl"><table><thead><tr><th>Kode</th><th>Mata kuliah</th><th>SKS</th><th>Kelas</th><th>Presensi</th><th>Nilai sementara</th></tr></thead><tbody>${MK.map(m=>`<tr><td class="num">${m.kode}</td><td><b>${m.nama}</b><div class="sm mut">${m.dosen.split(',')[0]}</div></td><td class="num">${m.sks}</td><td>${chip(m.kelas,'gray')}</td><td class="num">${pct(m.hdr,m.done)}%</td><td>${m.nilai?chip(grade(m.nilai)[0]+' ('+m.nilai+')','ok'):chip('Belum ada','gray')}</td></tr>`).join('')}</tbody></table></div><p class="sm mut" style="margin-top:10px">Nilai semester 5 bersifat sementara sampai UAS selesai.</p>`:s.ips?`<p>Semester selesai dengan IPS <b class="num">${s.ips.toFixed(2)}</b> dari ${s.sks} SKS. Rincian KHS ada di Arsip Dokumen.</p><button class="btn" style="margin-top:10px" data-go="arsip">${ico('arch','sm')} Buka KHS di arsip</button>`:`<p class="mut">Semester ini masih rencana studi (${s.plan}, ${s.sks} SKS). Data akan terisi setelah KRS disetujui.</p>`}</section>
  <section class="card"><h2 class="h2" style="margin-bottom:8px">Tren IPS per semester</h2><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik IPS semester 1 sampai 5" style="width:100%;min-width:420px;height:auto"><g stroke="var(--line)">${[3.6,3.8,4].map(v=>`<line x1="30" x2="${W-20}" y1="${py(v)}" y2="${py(v)}"/>`).join('')}</g><g fill="var(--mute)" font-size="11">${[3.6,3.8,4].map(v=>`<text x="0" y="${py(v)+4}">${v.toFixed(1)}</text>`).join('')}</g><path d="${line}" fill="none" stroke="var(--rose)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(p.ips)}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?'var(--card)':'var(--rose)'}" stroke="var(--rose)" stroke-width="2"/><text x="${px(i)}" y="${py(p.ips)-12}" text-anchor="middle" font-size="11" fill="var(--fg)">${p.ips.toFixed(2)}</text><text x="${px(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--mute)">Sem ${p.n}</text>`).join('')}</svg></div><p class="sm mut">IPS semester 5 masih estimasi.</p></section>`;
  return{html,crumb:cr('Beranda','Riwayat Akademik')};
};

/* ===== Study Planner ===== */
const KCOL=[['todo','Belum'],['doing','Sedang dikerjakan'],['done','Selesai']];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
PAGES.planner=()=>{
  const F=S.fokus;
  const html=`<section class="card"><div class="row between" style="gap:16px"><div><h1 class="h1">Study Planner</h1><p class="mut">Rencana belajar pribadi. Status Kanban ini bukan bukti pengumpulan resmi.</p></div><button class="btn p" data-act="addk">${ico('plus','sm')} Tambah tugas</button></div></section>
  <section class="grid g3"><div class="card stat"><span class="l">Target minggu ini</span><span class="v num">12 <small>/ 15 sesi</small></span>${bar(80)}</div><div class="card stat"><span class="l">Tugas selesai</span><span class="v num" id="kdone">${S.kanban.filter(k=>k.c==='done').length}</span></div><div class="card stat"><span class="l">Jam fokus</span><span class="v num">18.5 <small>jam/minggu</small></span></div></section>
  <div class="split"><section class="kan" id="kan">${KCOL.map(([c,n])=>`<div class="col" data-col="${c}" aria-label="${n}"><div class="row between"><b>${n}</b>${chip(S.kanban.filter(k=>k.c===c).length)}</div>${S.kanban.some(k=>k.c===c)?'':'<div class="sm mut">Belum ada tugas</div>'}${S.kanban.filter(k=>k.c===c).map(k=>`<div class="kc" draggable="true" data-kid="${k.id}"><div class="row between">${chip(mk(k.mk).kode)}<span class="sm mut">${k.d}</span></div><b ${c==='done'?'style="text-decoration:line-through;color:var(--mute)"':''}>${esc(k.t)}</b><div class="row between"><span class="sm ${k.p==='Tinggi'?'':'mut'}" style="${k.p==='Tinggi'?'color:var(--bad);font-weight:600':''}">${k.p}</span><span class="row" style="gap:4px">${c!=='todo'?`<button class="ib" style="width:28px;height:28px" data-act="kmove" data-id="${k.id}" data-d="-1" aria-label="Mundur">‹</button>`:''}${c!=='done'?`<button class="ib" style="width:28px;height:28px" data-act="kmove" data-id="${k.id}" data-d="1" aria-label="Maju">›</button>`:''}<button class="ib" style="width:28px;height:28px" data-act="kdel" data-id="${k.id}" aria-label="Hapus">${ico('trash','sm')}</button></span></div></div>`).join('')||''}</div>`).join('')}</section>
  <div style="display:flex;flex-direction:column;gap:20px;min-width:0"><section class="card"><div class="row between"><h2 class="h2">Pomodoro</h2>${chip('Sesi '+F.sesi+' dari 6')}</div>
  <div class="tabs" style="margin:12px 0">${[[25,'Fokus 25m'],[5,'Istirahat 5m'],[15,'Panjang 15m']].map(([m,n])=>`<button class="tab ${F.mode===m?'on':''}" data-act="pmode" data-m="${m}">${n}</button>`).join('')}</div>
  <label class="f">Tugas yang difokuskan<select id="pt"><option value="">Tanpa tugas tertentu</option>${TUGAS.filter(t=>['belum','dikerjakan'].includes(t.st)).map(t=>`<option ${t.id==F.tugas?'selected':''} value="${t.id}">${t.judul.slice(0,44)}</option>`).join('')}</select></label>
  <div class="timer num" id="tmr" aria-live="off">${fmt(F.sisa)}</div><div class="row" style="justify-content:center"><button class="btn p" id="pgo" data-act="ptoggle">${ico(F.run?'pause':'play','sm')} ${F.run?'Jeda':'Mulai sesi fokus'}</button><button class="btn" data-act="preset" aria-label="Atur ulang">${ico('reset','sm')}</button></div></section>
  <section class="card"><h2 class="h2" style="margin-bottom:10px">Catatan cepat</h2><div class="list" style="gap:8px">${S.notes.map((n,i)=>`<label class="row" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" data-act="nchk" data-i="${i}" ${n.x?'checked':''}><span ${n.x?'style="text-decoration:line-through;color:var(--mute)"':''}>${esc(n.t)}</span></label>`).join('')}</div></section></div></div>`;
  return{html,crumb:cr('Beranda','Study Planner'),after(){
    const d=$('#pt');if(d)d.onchange=()=>{F.tugas=+d.value};
    document.querySelectorAll('.kc').forEach(el=>{el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.kid);el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging')});
    document.querySelectorAll('.col[data-col]').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();const k=S.kanban.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(k){k.c=c.dataset.col;if(k.c==='done')k.d='Selesai';S._noscroll=1;render()}}})}};
};
function tick(){const F=S.fokus;if(!F.run)return;F.sisa--;const t=$('#tmr');if(t)t.textContent=fmt(F.sisa);if(F.sisa<=0){F.run=false;clearInterval(S.tm);if(F.mode===25)F.sesi=Math.min(F.sesi+1,6);toast(F.mode===25?'Sesi fokus selesai. Waktunya istirahat.':'Istirahat selesai.');F.sisa=F.mode*60;S._noscroll=1;if(route()==='planner')render()}}

/* ===== Arsip Dokumen (paling bawah, tidak dipromosikan) ===== */
PAGES.arsip=()=>{
  const k=S.tab.dk||'Semua',q=(S.filter.dq||'').toLowerCase();
  const cats=['Semua','KRS','KHS','Transkrip','Sertifikat','Surat'];
  const rows=DOCS.filter(d=>(k==='Semua'||d.k===k)&&(d.t+d.m).toLowerCase().includes(q));
  const html=`<section class="card"><h1 class="h1">Arsip Dokumen Akademik</h1><p class="mut">KRS, KHS, transkrip, sertifikat, dan surat milik ${ME.nama}. Hanya kamu yang bisa melihatnya.</p></section>
  <div class="row between"><div class="tabs">${cats.map(c=>`<button class="tab ${k===c?'on':''}" data-tab="dk:${c}">${c}</button>`).join('')}</div><div class="row"><label class="search" style="width:240px">${ico('search','sm')}<input id="dq" type="search" placeholder="Cari dokumen…" value="${esc(S.filter.dq||'')}"></label><button class="btn p" data-act="upl">${ico('up','sm')} Unggah</button></div></div>
  <section class="list">${rows.map(d=>`<article class="card" style="padding:16px"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px;min-width:0"><span class="ico">${ico('file')}</span><div style="min-width:0"><b>${d.t}</b><div class="sm mut">${d.m} · Rilis ${d.r}</div><div class="row" style="margin-top:6px">${chip(d.k)}${chip(d.s,'ok')}<span class="sm mut">${d.sz} PDF</span></div></div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="prev" data-n="${esc(d.t)}">${ico('eye','sm')}Pratinjau</button><button class="btn sm" data-act="dl" data-n="${esc(d.t)}">${ico('dl','sm')}Unduh</button></div></div></article>`).join('')||'<div class="card empty">Tidak ada dokumen yang cocok.</div>'}</section>`;
  return{html,crumb:cr('Beranda','Arsip Dokumen'),after(){const i=$('#dq');i.oninput=()=>{S.filter.dq=i.value;S._noscroll=1;const p=i.selectionStart;render();const n=$('#dq');n.focus();n.setSelectionRange(p,p)}}};
};
PAGES.more=()=>({html:`<section class="card"><h1 class="h1" style="margin-bottom:12px">Menu lainnya</h1><div class="list">${NAV.slice(4).map(n=>`<button class="item" style="border:0;text-align:left" data-go="${n[0]}">${ico(n[2])}<b style="flex:1">${n[1]}</b>${ico('chev','sm')}</button>`).join('')}<button class="item" style="border:0;text-align:left" data-go="arsip">${ico('arch')}<b style="flex:1">Arsip Dokumen</b>${ico('chev','sm')}</button><button class="item" style="border:0;text-align:left" data-act="theme">${ico('moon')}<b style="flex:1">Ganti tema</b></button><button class="item" style="border:0;text-align:left" data-act="logout">${ico('out')}<b style="flex:1">Keluar</b></button></div></section>`,crumb:cr('Beranda','Lainnya')});

/* ===== Events ===== */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const t=e.target.closest('[data-tab]');if(t){const[k,v]=t.dataset.tab.split(':');S.tab[k]=isNaN(v)?v:+v;S._noscroll=1;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;const x=a.dataset.act;
  if(subAct(x,a))return;
  if(x==='demo'){S.auth=true;go('dashboard');render();toast('Masuk sebagai Rimawati (demo)')}
  else if(x==='demo-off')toast('Versi ini hanya memuat portal mahasiswa.');
  else if(x==='showpw'){const p=$('#lp');p.type=p.type==='password'?'text':'password'}
  else if(x==='logout'){if(sb)sb.auth.signOut();UID=null;S.auth=false;render()}
  else if(x==='theme'){const d=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);setTheme(d?'light':'dark');S._noscroll=1;render()}
  else if(x==='notif')toast('3 notifikasi: tugas baru, materi baru, pengingat deadline.');
  else if(x==='presensi'){a.outerHTML='<span class="chip ok">Hadir tercatat '+TODAY.toTimeString().slice(0,5)+'</span>';toast('Presensi tercatat (simulasi).')}
  else if(x==='dl')toast('Mengunduh '+a.dataset.n+' (simulasi).');
  else if(x==='prev')toast('Pratinjau '+a.dataset.n+' (simulasi).');
  else if(x==='upl')toast('Pilih berkas untuk diunggah (simulasi).');
  else if(x==='pickday')toast('Tanggal '+a.dataset.n+' '+BLN[TODAY.getMonth()]+' '+TODAY.getFullYear());
  else if(x==='draft')toast('Draf tersimpan.');
  else if(x==='send'){const id=a.dataset.id,f=S.done['f'+id];if(!f||!f.ok){toast('Pilih berkas PDF (maks. 20 MB) dulu.');return}if(!$('#ori').checked){toast('Centang pernyataan orisinalitas dulu.');return}
    a.disabled=true;a.textContent='Mengirim…';setTimeout(()=>{TUGAS.find(t=>t.id==id).st='dikumpulkan';S._noscroll=1;render();toast('Tugas terkirim, '+tgl(TODAY)+' '+TODAY.toTimeString().slice(0,5)+' WIB.')},900)}
  else if(x==='kmove'){const k=S.kanban.find(z=>z.id==a.dataset.id),o=['todo','doing','done'];k.c=o[o.indexOf(k.c)+ +a.dataset.d];if(k.c==='done')k.d='Selesai';S._noscroll=1;render()}
  else if(x==='kdel'){S.kanban=S.kanban.filter(z=>z.id!=a.dataset.id);S._noscroll=1;render()}
  else if(x==='addk')addModal();
  else if(x==='nchk'){S.notes[a.dataset.i].x=a.checked?1:0;S._noscroll=1;render()}
  else if(x==='pmode'){const F=S.fokus;F.mode=+a.dataset.m;F.sisa=F.mode*60;F.run=false;clearInterval(S.tm);S._noscroll=1;render()}
  else if(x==='preset'){const F=S.fokus;F.sisa=F.mode*60;F.run=false;clearInterval(S.tm);S._noscroll=1;render()}
  else if(x==='ptoggle'){const F=S.fokus;F.run=!F.run;clearInterval(S.tm);if(F.run)S.tm=setInterval(tick,1000);S._noscroll=1;render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='lf'){e.preventDefault();if(!$('#lu').value.trim()||!$('#lp').value){$('#lerr').hidden=false;return}const b=$('#lb');b.disabled=true;const bt0=b.textContent;b.textContent='Memeriksa…';(async()=>{if(sb){const{data,error}=await sb.auth.signInWithPassword({email:$('#lu').value.trim().includes('@')?$('#lu').value.trim():$('#lu').value.trim()+'@campusflow.app',password:$('#lp').value});if(error){b.disabled=false;b.textContent=bt0;$('#lerr').hidden=false;return}UID=data.user.id}else if($('#lu').value.trim()!==ME.nim||$('#lp').value!=='Rimawati123'){b.disabled=false;b.textContent=bt0;$('#lerr').hidden=false;return}S.auth=true;if(!location.hash||location.hash==='#login')location.hash='dashboard';render();cloudPull()})()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const q=$('#q');if(q)q.focus()}});
function addModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<form><h2 class="h2">Tambah tugas belajar</h2><label class="f">Judul<input id="nt" type="text" required></label><label class="f">Mata kuliah<select id="nm">${MK.map(x=>`<option value="${x.id}">${x.nama}</option>`).join('')}</select></label><label class="f">Prioritas<select id="np"><option>Normal</option><option>Tinggi</option></select></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="nc">Batal</button><button class="btn p">Simpan</button></div></form>`;document.body.append(m);$('#nt').focus();
  $('#nc').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('form').onsubmit=e=>{e.preventDefault();const t=$('#nt').value.trim();if(!t)return;S.kanban.push({id:Date.now(),t,mk:+$('#nm').value,c:'todo',p:$('#np').value,d:'Baru'});m.remove();S._noscroll=1;render();toast('Tugas ditambahkan.')}}
function clk(){TODAY=new Date();const c=$('#clk');if(c)c.textContent=HARI[TODAY.getDay()]+', '+tgl(TODAY)+' · '+TODAY.toTimeString().slice(0,8)+' WIB'}
let _d=TODAY.toDateString(),_m=TODAY.getMinutes();
setInterval(()=>{clk();if(S.auth&&['dashboard','kalender'].includes(route())&&(TODAY.getMinutes()!==_m||TODAY.toDateString()!==_d)){_m=TODAY.getMinutes();_d=TODAY.toDateString();rr()}},1000);
/* init */
const th=load('theme');if(th)setTheme(th);
try{JSON.parse(load('tugas')||'[]').forEach(x=>{x.dl=new Date(x.dl);TUGAS.push(x)})}catch(e){}
if(sb)sb.auth.getSession().then(({data})=>{if(data.session){UID=data.session.user.id;S.auth=true;render();cloudPull()}});
render();
</script>
